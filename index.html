<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoBuzz</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #ff5a00;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .login-btn {
      background: #ff5a00;
      color: white;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 15px;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .post {
      background: white;
      border-radius: 12px;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .user {
      padding: 15px;
      font-weight: bold;
    }

    .post img {
      width: 100%;
      display: block;
    }

    .actions {
      padding: 12px 15px;
    }

    .action-btn {
      background: none;
      font-size: 16px;
      margin-right: 15px;
    }

    .like {
      color: #e91e63;
    }

    .comment {
      padding: 0 15px 15px;
      display: flex;
      gap: 8px;
    }

    .comment input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .comment button {
      background: #ff5a00;
      color: white;
      padding: 10px 12px;
      border-radius: 8px;
    }

    /* Login box */
    .auth-box {
      display: none;
      background: white;
      max-width: 400px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 2px 12px rgba(0,0,0,.12);
    }

    .auth-box h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    .auth-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .auth-box button {
      width: 100%;
      padding: 12px;
      background: #ff5a00;
      color: white;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .switch {
      text-align: center;
      color: #ff5a00;
      cursor: pointer;
      margin-top: 8px;
    }

    .user-info {
      display: none;
      text-align: center;
      background: white;
      padding: 15px;
      margin: 20px auto;
      max-width: 700px;
      border-radius: 12px;
    }

    .logout-btn {
      margin-top: 10px;
      background: #333;
      color: white;
      padding: 9px 18px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">PhotoBuzz</div>
  <button class="login-btn" onclick="showLogin()">Login</button>
</header>

<!-- Authentication -->
<div class="auth-box" id="authBox">

  <h2 id="authTitle">Login to PhotoBuzz</h2>

  <input
    type="text"
    id="name"
    placeholder="Your name"
    style="display:none;"
  >

  <input
    type="email"
    id="email"
    placeholder="Email address"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button id="authButton" onclick="loginUser()">
    Login
  </button>

  <div class="switch" id="switchButton" onclick="showRegister()">
    Create a new account
  </div>

</div>

<!-- User information -->
<div class="user-info" id="userInfo">
  <div id="welcomeText"></div>
  <button class="logout-btn" onclick="logoutUser()">
    Logout
  </button>
</div>

<!-- Feed -->
<div class="container">

  <div class="post">

    <div class="user" id="userName">📷 Loading...</div>

    <img
      src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=900&q=80"
      alt="PhotoBuzz post"
    >

    <div class="actions">

      <button
        class="action-btn like"
        onclick="likePost(this)"
      >
        ❤️ <span>0</span>
      </button>

      <button class="action-btn">
        💬 Comment
      </button>

      <button class="action-btn">
        🔗 Share
      </button>

    </div>

    <div class="comment">

      <input
        type="text"
        placeholder="Write a comment..."
      >

      <button>
        Post
      </button>

    </div>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* =========================
     FIREBASE CONFIG
  ========================= */

  const firebaseConfig = {

    apiKey: "AIzaSyAyKPaIJHYGo0kjU50z4sWJPe8b9pEPxOQ",

    authDomain: "photobuzz-d2ac1.firebaseapp.com",

    projectId: "photobuzz-d2ac1",

    storageBucket: "photobuzz-d2ac1.firebasestorage.app",

    messagingSenderId: "970322181868",

    appId: "1:970322181868:web:f8477800768db26ee3afc9"

  };


  /* =========================
     FIREBASE START
  ========================= */

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  /* =========================
     LIKE
  ========================= */

  window.likePost = function(button) {

    const count = button.querySelector("span");

    count.textContent =
      Number(count.textContent) + 1;

  };


  /* =========================
     SHOW LOGIN
  ========================= */

  window.showLogin = function() {

    document.getElementById("authBox").style.display = "block";

    document.getElementById("authTitle").textContent =
      "Login to PhotoBuzz";

    document.getElementById("name").style.display = "none";

    document.getElementById("authButton").textContent =
      "Login";

    document.getElementById("authButton").onclick =
      loginUser;

    document.getElementById("switchButton").textContent =
      "Create a new account";

    document.getElementById("switchButton").onclick =
      showRegister;

  };


  /* =========================
     SHOW REGISTER
  ========================= */

  window.showRegister = function() {

    document.getElementById("authBox").style.display = "block";

    document.getElementById("authTitle").textContent =
      "Create PhotoBuzz Account";

    document.getElementById("name").style.display = "block";

    document.getElementById("authButton").textContent =
      "Create Account";

    document.getElementById("authButton").onclick =
      registerUser;

    document.getElementById("switchButton").textContent =
      "Already have an account? Login";

    document.getElementById("switchButton").onclick =
      showLogin;

  };


  /* =========================
     REGISTER
  ========================= */

  window.registerUser = async function() {

    const name =
      document.getElementById("name").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    if (!name || !email || !password) {

      alert("Please fill in all fields.");

      return;

    }


    if (password.length < 6) {

      alert("Password must be at least 6 characters.");

      return;

    }


    try {

      const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      await updateProfile(result.user, {
        displayName: name
      });


      await setDoc(
        doc(db, "users", result.user.uid),
        {
          name: name,
          email: email,
          createdAt: serverTimestamp()
        }
      );


      alert("Account created successfully!");

      document.getElementById("authBox").style.display =
        "none";

    }

    catch(error) {

      alert(error.message);

    }

  };


  /* =========================
     LOGIN
  ========================= */

  window.loginUser = async function() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    if (!email || !password) {

      alert("Enter your email and password.");

      return;

    }


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      alert("Login successful!");

      document.getElementById("authBox").style.display =
        "none";

    }

    catch(error) {

      alert(error.message);

    }

  };


  /* =========================
     LOGOUT
  ========================= */

  window.logoutUser = async function() {

    try {

      await signOut(auth);

      alert("Logged out!");

    }

    catch(error) {

      alert(error.message);

    }

  };


  /* =========================
     AUTH STATE
  ========================= */

  onAuthStateChanged(auth, (user) => {

    const loginButton =
      document.querySelector(".login-btn");

    const userInfo =
      document.getElementById("userInfo");

    const welcomeText =
      document.getElementById("welcomeText");


    if (user) {

      loginButton.style.display = "none";

      userInfo.style.display = "block";

      welcomeText.textContent =
        "Welcome, " +
        (user.displayName || user.email) +
        " 👋";

    }

    else {

      loginButton.style.display = "block";

      userInfo.style.display = "none";

    }

  });

</script>

</body>
</html>
